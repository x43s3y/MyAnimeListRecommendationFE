<div class="anime-generator-container">
  <h2>Random Anime Generator</h2>

  <div class="nickname-field">
    <input id="nickname" #nickname placeholder="Enter your nickname">
  </div>

  <button class="generate-btn" (click)="generateRandomAnime(animeData$)">
    🎲 Generate
  </button>

  <div class="anime-card" *ngIf="randomAnime$ | async as anime">
    <h3>{{ anime.title }}</h3>
    <img [src]="anime.icon" alt="{{ anime.title }} image" />
  </div>
</div>
